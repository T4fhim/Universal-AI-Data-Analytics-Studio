[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Phase 3.1 of the desktop->web transition: the Django 6 + Django Ninja backend lives
# in its own distribution so the Qt-free core (`uadas_core`, root pyproject.toml) never
# acquires a web-framework dependency -- see plans/phase-3-readiness.md ruling 1. It
# depends on the root distribution (install both: `pip install -e . -e apps/api`).
# There is deliberately no uv workspace yet: the root distribution's dependencies are
# `requirements.txt`, which still mixes runtime and dev tools.
[project]
name = "uadas-api"
version = "0.0.0"
description = "Django + Django Ninja backend for the Universal AI Data Analytics Studio web app."
requires-python = ">=3.13"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "universal-ai-data-analytics-studio",
    "django>=6.0,<7",
    # `Status(...)` (explicit response status) replaced the deprecated tuple return.
    "django-ninja>=1.7",
    "django-cors-headers",
    "psycopg[binary]",
    "dj-database-url",
    # 3.3 auth. The `socialaccount` extra pulls the OAuth client libraries (PyJWT,
    # requests-oauthlib, cryptography) the GitHub/Google providers need; headless, the
    # JSON API, is in the base distribution. The lower bound is the first release this
    # configuration was verified against (ACCOUNT_LOGIN_METHODS / ACCOUNT_SIGNUP_FIELDS,
    # ALLAUTH_TRUSTED_PROXY_COUNT and the `HEADLESS_*` names are 65.x-era), the upper bound
    # keeps a major release from changing the auth surface unreviewed.
    "django-allauth[socialaccount]>=65.19,<66",
    # Django's built-in Redis cache backend (`REDIS_URL`) needs the client library; the
    # shared cache is what makes allauth's rate limits hold across workers. The upper bound is
    # Celery's: `celery[redis]` 5.6 (kombu 5.6) supports redis-py up to 6.4, and an unbounded
    # `redis` would resolve 7+/8 and make pip pick between the two (observed: celery[redis]
    # downgraded an installed redis 8.1.0 to 6.4.0).
    "redis>=5,<7",
    # 3.5 background jobs. Celery is the courier behind the `uadas_api.jobs` facade (the only
    # three modules that import it: celery_app, tasks, queue); Redis is the broker. Chosen over
    # `django.tasks` (6.1 ships only an in-process Immediate and a Dummy backend) and its
    # third-party backends (none gives acks-late, visibility-timeout and time-limit control,
    # bounded retries with backoff): see plans/phase-3-5-jobs.md. The ceiling keeps a Celery 6
    # from changing the delivery semantics unreviewed. JSON serialization only (settings/_jobs.py).
    "celery[redis]>=5.6,<6",
    # 3.4 object storage: django-storages' S3Storage builds the configured boto3 client (any
    # S3-compatible endpoint: MinIO, AWS S3, R2); only `uadas_api/storage/s3.py` imports
    # either. 1.14 is the first line with the `STORAGES` setting and `client_config`; boto3
    # 1.36 changed the default checksum behaviour, which `settings/_storage.py` pins
    # explicitly, so the lower bound is the first release with those config keys.
    "django-storages[s3]>=1.14,<2",
    "boto3>=1.36,<2",
]

[project.optional-dependencies]
dev = [
    "pytest-django",
    "pytest-cov",
    "django-stubs[compatible-mypy]",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["uadas_api*"]

[tool.pytest.ini_options]
# Scoped to apps/api on purpose (plans/phase-3-readiness.md ruling 4): pytest takes the
# nearest ini-file above the paths it is given, so `pytest apps/api/tests` reads this
# table and `python -m pytest tests` at the repo root keeps reading the root one. The
# settings module must NOT become a global env var -- pytest-django would then
# initialise Django during the core suite's run.
DJANGO_SETTINGS_MODULE = "uadas_api.settings.test"
testpaths = ["tests"]
pythonpath = ["."]
# `-p uadas_api.pytest_env` scrubs OAuth credentials from the environment before pytest-django
# reads the settings (a conftest would be too late); see that module and test_hermetic_env.py.
addopts = "-ra -p uadas_api.pytest_env"

# Ruff: inherit the repo-root configuration (rule selection, line length), and relax only
# RUF012 ("mutable class attribute needs ClassVar") where Django's own API requires a
# plain list on a class body: `Meta.indexes` / `Meta.constraints` on models, and
# `dependencies` / `operations` on migrations. Scoped to apps/api; the core is unchanged.
[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.per-file-ignores]
"uadas_api/*/models.py" = ["RUF012"]
"uadas_api/*/migrations/*.py" = ["RUF012"]
# Tests unpack fixtures positionally (`org, user, project, job = setup_job()`) and use only what
# the test needs; naming the rest `_` everywhere would hurt readability more than it helps.
"tests/*.py" = ["RUF059"]
# The hostile-reader stand-in is *meant* to swallow exceptions, loop forever and hold a mutable
# class attribute like the parsers it models (see the module docstring).
"tests/sandbox_launcher.py" = ["BLE001", "SIM105", "RUF012"]

[tool.mypy]
# Run from apps/api (`cd apps/api && python -m mypy uadas_api`): mypy reads the config
# in the current directory, and this table loads the django-stubs plugin, which the
# repo-root [tool.mypy] (the core's curated, plugin-free run) must not.
python_version = "3.13"
# The deployment platform, and CI's: the sandbox is written for Linux (os.killpg, setrlimit,
# SIGXCPU ...), with Windows branches guarded by `sys.platform`. Pinning the platform makes the
# report identical on a Windows laptop and on the Linux runner instead of "attribute missing" noise.
platform = "linux"
plugins = ["mypy_django_plugin.main"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

# The core is installed editable, which mypy cannot resolve, and it has its own curated
# mypy run at the repo root (docs/MYPY_DEBT.md). Only tests/test_choices_parity.py imports
# it; treating it as untyped keeps the core's debt out of this job.
[[tool.mypy.overrides]]
module = ["uadas_core", "uadas_core.*"]
ignore_missing_imports = true

# django-allauth ships no type information (no py.typed); the adapters we subclass are
# therefore `Any` to mypy. Treated as untyped rather than silenced line by line.
[[tool.mypy.overrides]]
module = ["allauth", "allauth.*"]
ignore_missing_imports = true

# Celery and kombu (3.5) ship no type information either; `uadas_api.jobs.{celery_app,tasks,queue}`
# are the only modules that import them. openpyxl / python-docx are imported by the tests only
# (to build fixtures); the API code never imports a parsing library. (pandas in the tests carries
# an inline ignore, like the existing storage tests.)
[[tool.mypy.overrides]]
module = [
    "celery", "celery.*", "kombu", "kombu.*",
    "openpyxl", "openpyxl.*", "docx", "docx.*",
]
ignore_missing_imports = true

# boto3 / botocore / django-storages ship no type information. Treated as untyped rather than
# silenced line by line; `uadas_api/storage/s3.py` is the one SDK seam.
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*", "storages", "storages.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "uadas_api.settings.dev"
