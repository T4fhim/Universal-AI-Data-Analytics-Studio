name: CI

# Since Phase 2.6 of the desktop->web transition this repository is a Qt-free core
# (`uadas_core/`) plus its tests; the PySide6 desktop shell, its Windows runner and
# its UIA job were deleted in 2.5. Everything here runs on Linux -- the Phase-3 web
# backend target -- so a Windows-only assumption in the core fails CI instead of
# surviving until deployment.
#
# Phase 3.1 adds the Django backend (`apps/api`, package `uadas_api`): its own
# `api-test` job against a Postgres 17 service container, `apps/api` under the lint
# job's ruff/black/isort, and a `django`-not-importable assertion in the core `test`
# job (the core never installs the web framework). See plans/phase-3-readiness.md.
#
# Jobs: `test` (core imports, types, the suite), `api-test` (the Django backend's
# suite, deployment check and bandit), `lint` (ruff/import-linter/bandit/black/isort),
# `dco` (PR sign-off).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    # Promoted from the former `linux_import` job, which already ran exactly the
    # surviving suite. Replaces the Windows `test` job (QtWebEngine, the Py_Finalize
    # access violation, the two-invocation Qt split -- all gone with src/ui) and the
    # Windows-only `uia_integration` job.
    #
    # unixodbc-dev and libmagic1 are the OS packages pyodbc / python-magic need to build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: OS deps for pyodbc / python-magic
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libmagic1

      - name: Install dependencies
        # requirements-dev.txt = requirements.txt (runtime) + the pinned dev tools (pytest, mypy ...).
        run: python -m pip install -r requirements-dev.txt

      - name: Assert no Qt binding or Django is importable
        # Now the primary runtime proof that the core is Qt-free, alongside the
        # lint job's `lint-imports`: if a dependency ever pulls a Qt binding back
        # in, this fails before the suite can pass by accident. Phase 3.1 extends it
        # to Django: the web backend (apps/api) is installed only by the `api-test`
        # job, so the core's own dependency set must never bring the framework in.
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("PySide6", "PyQt5", "PyQt6", "shiboken6", "django")
                     if importlib.util.find_spec(m) is not None]
          print("importable Qt bindings / Django:", present or "none")
          sys.exit(1 if present else 0)
          PY

      - name: import uadas_core
        run: |
          python -c "import uadas_core; import uadas_core.bootstrap; import uadas_core.services.workspace_service; import uadas_core.ai.assistant_service; import uadas_core.visualization.chart_registry; import uadas_core.database.base_connection; import uadas_core.command_stack; print('uadas_core imports clean')"

      - name: mypy (clean packages)
        # Curated list of packages/modules that are currently clean -- not the whole
        # repo (see docs/MYPY_DEBT.md for what is excluded and why). When a module
        # becomes clean, add it here. --follow-imports=silent keeps mypy using the
        # signatures of modules these call into without holding it responsible for
        # their own pre-existing debt.
        run: >
          python -m mypy
          uadas_core/core uadas_core/services uadas_core/analysis uadas_core/database
          uadas_core/results uadas_core/persistence uadas_core/jobs uadas_core/provenance
          uadas_core/theme uadas_core/a11y uadas_core/help uadas_core/data_table
          uadas_core/actions uadas_core/models uadas_core/bootstrap.py
          uadas_core/command_stack.py
          --ignore-missing-imports --follow-imports=silent

      - name: Collected-test count is not silently shrinking
        # A suite that quietly collects far fewer tests than it should would still go
        # green (observation 0022). 868 at the 2.5 cut-over; the floor leaves room to
        # prune a few tests deliberately but fails on a real collapse. Raise it as the
        # suite grows -- lowering it should be a conscious, reviewed change.
        run: |
          out="$(python -m pytest tests/ --collect-only -q -p no:cacheprovider)"
          echo "$out" | tail -n 3
          count="$(echo "$out" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')"
          test -n "$count" || { echo "::error::could not read a collected-test count"; exit 1; }
          echo "collected: $count"
          test "$count" -ge 860 || { echo "::error::collected $count tests, expected at least 860"; exit 1; }

      - name: pytest
        run: python -m pytest tests/ -q --tb=long -p no:cacheprovider

  api-test:
    # Phase 3.1: the Django 6 + Django Ninja backend (apps/api, package `uadas_api`).
    # A separate job from `test` on purpose -- the core job must keep proving the core
    # runs with no web framework installed. Postgres 17 is the production engine, so
    # the suite runs against it here (`DATABASE_URL`; locally it falls back to in-memory
    # SQLite). The service credentials are throwaway and only reachable on the runner.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uadas
          POSTGRES_PASSWORD: uadas
          POSTGRES_DB: uadas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uadas -d uadas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        # Phase 3.5: the job queue's broker. `test_jobs_integration.py` starts a real
        # `celery worker` against it (and against the Postgres above and the MinIO below), so
        # the task message, the cross-process claim and the sandbox child are exercised for
        # real; every other test runs Celery eagerly against an in-memory broker.
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://uadas:uadas@localhost:5432/uadas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            apps/api/pyproject.toml

      - name: OS deps for pyodbc / python-magic and the sandboxed parser
        # libgl1 / libglib2.0-0 / libxcb1: the parser child imports OpenCV through the core's
        # readers, which needs them (a bare python:3.13-slim lacks them and every parse then fails
        # as `parse_error`; verified in a clean container). The GitHub runner image already has
        # them, so this is documentation that cannot rot silently, not a new requirement. Tesseract
        # itself is not installed: no test OCRs an image.
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libmagic1 libgl1 libglib2.0-0 libxcb1

      - name: Allow unprivileged user namespaces (the sandbox's network isolation)
        # The child isolates its network with unshare(CLONE_NEWUSER|CLONE_NEWNET). Ubuntu 24.04
        # runners restrict that through AppArmor; lift it for this job and, only if a namespace
        # then really works, make the isolation test *require* it (SANDBOX_REQUIRE_NETNS=1).
        # If the host still refuses, the test asserts the honest report instead (the child says
        # `network_isolated=False`) and a warning is printed -- it never silently passes as isolated.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          if unshare --user --net true; then
            echo "SANDBOX_REQUIRE_NETNS=1" >> "$GITHUB_ENV"
          else
            echo "::warning::this runner refuses unprivileged user namespaces; network-namespace isolation is not exercised"
          fi

      - name: Install dependencies
        # The root distribution (uadas_core) plus the API in editable mode, with its
        # `dev` extra (pytest-django, pytest-cov, django-stubs). requirements-dev.txt carries the
        # runtime set plus the pinned dev tools (mypy and bandit run in this job).
        run: python -m pip install -r requirements-dev.txt -e . -e "apps/api[dev]"

      - name: Start MinIO (a real S3-compatible store for the storage tests)
        # Phase 3.4: `test_storage_*` run against an in-memory fake by default, and against
        # this real MinIO as well when STORAGE_INTEGRATION=1 (set on the pytest step below).
        # Throwaway CI-only credentials; the container lives only for this job. The image is
        # pinned to a release (the one docker-compose.dev.yml uses, and the one the
        # real-store tests were verified against): `latest` could change behaviour -- or
        # drop a feature the tests rely on -- between two runs of the same commit.
        run: |
          docker run -d --name minio --user 0:0 -p 9000:9000 \
            -e MINIO_ROOT_USER=ci-minio-user \
            -e MINIO_ROOT_PASSWORD=ci-minio-secret-0123456789 \
            cgr.dev/chainguard/minio@sha256:dc455cdd4db6e390b1b26514f15ff37681a777bf8dab41aac445a0259f751e56 server /data
          ready=0
          for i in $(seq 1 60); do
            if curl -sf http://localhost:9000/minio/health/ready; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::MinIO did not become ready within 60 s; the real-store tests cannot run"
            docker logs minio || true
            exit 1
          fi
          python - <<'PY'
          import boto3
          boto3.client(
              "s3",
              endpoint_url="http://localhost:9000",
              aws_access_key_id="ci-minio-user",
              aws_secret_access_key="ci-minio-secret-0123456789",
              region_name="us-east-1",
          ).create_bucket(Bucket="uadas-ci")
          PY

      - name: mypy (apps/api, django-stubs)
        # Its own run, from apps/api, so mypy reads apps/api/pyproject.toml (which loads
        # the django-stubs plugin) instead of the repo-root config (the core's curated,
        # plugin-free run above). Verified clean with the pinned mypy==2.1.0 and
        # django-stubs 6.1.1: the whole package and its tests, no exclusions.
        working-directory: apps/api
        run: python -m mypy uadas_api tests

      - name: Collected-test count is not silently shrinking
        # Same guard as the core job (observation 0022), with its own floor. 731 tests
        # at 3.3 auth (484 at the 3.2 data model, 65 at the 3.1 skeleton; most of the
        # growth is the discovery-based tenant-isolation harness, which multiplies one
        # check across every tenant model, and 3.3's auth/role/last-owner suites) and 744
        # after the core session seam (core_bridge tests) and 1271 at 3.4 storage (settings,
        # keys, facade, lifecycle, D4-on-object-storage atomicity; the facade and workspace
        # suites are parametrized over an in-memory fake and a real MinIO, so they count
        # twice) and 1913 at 3.6 (the API surface: resources, stage routers, upload, the IDOR walk,
        # the OpenAPI contract, Schemathesis -- 34 fuzzed read operations plus a real-id smoke) and
        # 2010 at 3.7 streaming (+97: SSE framing, stream caps, the job-event loop on a fake clock,
        # the real-ASGI stream tests, the assistant endpoint with a fake provider, and the review-fix
        # hardening tests: slot leaks, abandoned provider threads, counter expiry, event sizes).
        # The count includes four Postgres-only tests that skip on SQLite (three race tests and 3.7's
        # server-side connection-count test, which must run in this job: it is the leak proof) and
        # the MinIO-parametrized tests, which this job runs against the container above.
        # The floor is that minus 2, leaving room to prune a couple deliberately while failing
        # on a real collapse (e.g. a conftest import error that silently drops a whole
        # module). Raise it as the suite grows -- lowering it should be a conscious, reviewed
        # change.
        run: |
          out="$(python -m pytest apps/api/tests --collect-only -q -p no:cacheprovider)"
          echo "$out" | tail -n 3
          count="$(echo "$out" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')"
          test -n "$count" || { echo "::error::could not read a collected-test count"; exit 1; }
          echo "collected: $count"
          test "$count" -ge 2008 || { echo "::error::collected $count tests, expected at least 2008"; exit 1; }

      - name: pytest (apps/api)
        # DJANGO_SETTINGS_MODULE comes from apps/api/pyproject.toml, not the
        # environment, so the core suite above never initialises Django.
        # STORAGE_* point the opt-in real-store tests at the MinIO started above; the
        # `test` settings never read them (the suite itself stays hermetic).
        env:
          STORAGE_INTEGRATION: "1"
          STORAGE_ENDPOINT_URL: http://localhost:9000
          STORAGE_BUCKET: uadas-ci
          STORAGE_ACCESS_KEY_ID: ci-minio-user
          STORAGE_SECRET_ACCESS_KEY: ci-minio-secret-0123456789
          # Phase 3.5: the real-worker test (a real `celery worker`, Redis, Postgres, MinIO).
          # `test_jobs_ci_guard.py` fails the build if either is lost. Database 5 so the worker's
          # private queue cannot meet the cache's keys.
          JOBS_INTEGRATION: "1"
          CELERY_BROKER_URL: redis://localhost:6379/5
        # Skips are budgeted, not ignored. About a hundred storage tests skip silently when the
        # real-store environment is lost, which would turn the build green while removing the
        # strongest evidence; `test_storage_ci_guard.py` (and, for the real worker and the Linux-only
        # sandbox limits, `test_jobs_ci_guard.py` / `test_sandbox_ci_guard.py`) fail those cases
        # (CI=true), and this fails the job if more than the known skips occur. The budget is 8 with **no
        # spare**, counted by running this suite on Linux as an unprivileged uid with the guard
        # variables set (the PostgreSQL row-lock tests and the MinIO / Redis ones run in this job,
        # so they are not skips). Exactly:
        #   1  the SSE storage test (MinIO has no KMS, so STORAGE_TEST_SSE is off);
        #   5  Windows/macOS twins that skip on Linux *by design* (they assert what a platform
        #      WITHOUT rlimits reports): test_checks.py (the `check --deploy` twin),
        #      test_entrypoints.py (the wsgi and asgi twins), test_sandbox_guards.py and
        #      test_sandbox_malformed.py (the "honesty" tests);
        #   2  the dedicated-uid tests in test_sandbox_isolation.py, which need a *root* worker
        #      (the runner is unprivileged; they run in a root Linux container instead).
        # 3.7 adds none: its only conditional test (server-side connection count) needs PostgreSQL, runs
        # here, and *fails* rather than skips under CI=true if DATABASE_URL is lost.
        # Any new skip is a reviewed change to this number that says what skips and why.
        shell: bash
        run: |
          python -m pytest apps/api/tests -q --tb=long -p no:cacheprovider -rs --ignore=apps/api/tests/test_web_schemathesis.py | tee pytest-api.log
          skipped="$(grep -oE '[0-9]+ skipped' pytest-api.log | tail -n 1 | grep -oE '^[0-9]+' || true)"
          skipped="${skipped:-0}"
          echo "skipped: $skipped"
          test "$skipped" -le 8 || { echo "::error::$skipped tests skipped, budget is 8 (is the MinIO / Redis integration environment intact, and is this an unprivileged Linux runner?)"; exit 1; }

      - name: OpenAPI contract is committed and current (drift check)
        # Phase 3.6: apps/api/openapi.json is the contract the web client's TypeScript is generated
        # from (Phase 4.1). Regenerate it offline from the routers (no server, no database) and fail
        # if the working tree then differs: a route change that did not update the committed
        # schema cannot merge. `tests/test_web_openapi.py` makes the same comparison in the suite.
        working-directory: apps/api
        run: |
          python -m uadas_api.web.openapi
          git diff --exit-code -- openapi.json

      - name: Schemathesis (committed schema, in process)
        # Contract fuzzing of the read endpoints through the real WSGI application with a logged-in
        # session, plus a real-id smoke of every GET: documented status, content type and body.
        # Derandomized, with Hypothesis's example database off (it does use the test database, in the
        # test's own transaction, for its fixtures), so it cannot flake. Kept out of the main pytest step above
        # (`--ignore`) so that step's skip budget stays what it was; it has no skips of its own.
        run: python -m pytest apps/api/tests/test_web_schemathesis.py -q --tb=long -p no:cacheprovider

      - name: manage.py check --deploy (prod settings)
        # The deployment checklist must be clean with a valid production environment;
        # any warning fails the build. The values are throwaway CI-only inputs.
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: uadas_api.settings.prod
          DJANGO_SECRET_KEY: ci-throwaway-key-9f3b7c1e4a8d2f6b0c5e7a1d3b9f8e2c4a6d0b1e3c5f7a9b
          DJANGO_ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgres://uadas:uadas@localhost:5432/uadas
          # Required since 3.3 (prod refuses to start without them): the shared cache for
          # allauth's rate limits, the SMTP relay + sender for verification mail, and the
          # SPA's address for the links inside it. Throwaway values; no credentials.
          REDIS_URL: redis://localhost:6379/0
          DEFAULT_FROM_EMAIL: UADAS <no-reply@example.com>
          EMAIL_HOST: smtp.example.com
          FRONTEND_BASE_URL: https://app.example.com
          # Required since 3.4 (prod refuses to start without a bucket and real-looking
          # credentials, and an https endpoint). Random-looking throwaways, not placeholders.
          STORAGE_SSE: aes256
          # Required since 3.5: say what separates the parser child from the worker and what
          # isolates its network (the CI runner is an unprivileged user, not a container, so
          # these are the operator's statements a real deployment would make for its container).
          SANDBOX_ISOLATION_ACKNOWLEDGED: container
          SANDBOX_NETWORK_ISOLATION: container
          # Required since 3.8: production states a limit for every quota or says unlimited is
          # intended (the CI instance is a throwaway, so it says so).
          QUOTA_UNLIMITED_ACKNOWLEDGED: "true"
          STORAGE_BUCKET: uadas-ci-data
          STORAGE_ENDPOINT_URL: https://objects.example.com
          STORAGE_ACCESS_KEY_ID: ci-key-4f7q2m9xj3kd8tlp
          STORAGE_SECRET_ACCESS_KEY: wJ9r3Kd8Zx2PqL7mV5nB1cT6yH4sG0aE9uRf
        run: python manage.py check --deploy --fail-level WARNING

      - name: bandit (apps/api)
        # Only B101 (assert_used) is skipped -- the API has no accepted findings.
        # Tests are not scanned (they assert freely and spawn subprocesses).
        run: python -m bandit -r apps/api/uadas_api -q --skip B101

  web:
    # Phase 4 (apps/web): the web app had no CI. Typecheck, lint, production build and the golden
    # screenshots of the chart skin. It runs inside the Playwright image the baselines are rendered
    # in (apps/web/playwright.config.ts says why); the image tag must equal the pinned
    # @playwright/test version, which the first step checks so the two cannot drift apart.
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.1-noble
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - name: Image tag matches the pinned Playwright version
        run: test "$(node -p "require('./package.json').devDependencies['@playwright/test']")" = "1.64.1"

      - name: Install pnpm
        run: npm install --global "$(node -p "require('./package.json').packageManager")"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm exec tsc -b

      - name: oxlint
        run: pnpm exec oxlint

      - name: Production build
        run: pnpm exec vite build

      - name: Golden screenshots
        run: pnpm exec playwright test

      - name: Keep the diff images when a golden test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-diffs
          path: |
            apps/web/test-results
            apps/web/playwright-report

  lint:
    # `ruff check` and `bandit` were once enforced only by .claude/hooks/ and
    # .pre-commit-config.yaml -- never in CI itself, so a commit made outside a Claude
    # Code session bypassed both. This job closes that gap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install lint tools
        # Versions kept in sync with requirements-dev.txt (and therefore with
        # .pre-commit-config.yaml and the local hooks). If a pin changes there,
        # change it here too. import-linter provides `lint-imports`; grimp analyses
        # uadas_core statically, so none of its runtime deps need installing here.
        run: python -m pip install ruff==0.16.3 bandit==1.9.4 black==26.5.1 isort==8.0.1 import-linter==2.15

      - name: ruff check
        run: python -m ruff check uadas_core/ tests/ apps/api/

      - name: import-linter (uadas_core stays Qt-free)
        # Six contracts: Qt/Django forbidden in the core, provenance is a leaf, the
        # `layers` stack, the core never imports uadas_api, uadas_api never
        # imports uadas_core.plugins / .jobs, and (3.5) uadas_api imports uadas_core.readers and
        # the parsing libraries only in the sandbox child (see .importlinter). uadas_api is a root
        # package there but is not installed in this job, so apps/api goes on
        # PYTHONPATH -- without it lint-imports cannot find the package.
        env:
          PYTHONPATH: apps/api
        run: lint-imports

      - name: bandit
        # `bandit -r uadas_core` has a pre-existing set of accepted findings, skipped
        # by code (cross-platform -- a path-keyed baseline file breaks between
        # Windows and Linux):
        #   B101 assert_used            -- asserts are used deliberately here.
        #   B107 hardcoded_password_default -- fires on `password: str = ""` defaults
        #                                 in ConnectionProfile /
        #                                 DatabaseConnectionService, which
        #                                 deliberately hold NO real password.
        #   B608 hardcoded_sql_expressions  -- 2 intentional query-construction sites
        #                                 (base_connection.py, sqlite_reader.py),
        #                                 confidence Low. execute_query is gated
        #                                 behind an explicit capability but still
        #                                 builds the query from a string, so B608 stays
        #                                 skipped (confirmed by security-reviewer).
        run: python -m bandit -r uadas_core -q --skip B101,B107,B608

      - name: black --check
        run: python -m black --check uadas_core/ tests/ scripts/ apps/api/

      - name: isort --check-only
        run: python -m isort --check-only uadas_core/ tests/ scripts/ apps/api/

  dco:
    # Phase 0.8: Developer Certificate of Origin. Every commit introduced
    # by a pull request must carry a `Signed-off-by:` trailer matching its
    # author -- see CONTRIBUTING.md for the `git commit -s` flow.
    #
    # ENFORCING since the desktop->web transition's Phase 2 (set 2026-09-10,
    # right after Phase 1 merged to main via PR #3). The Phase 0/1 commits
    # that predate this policy were not history-rewritten to backfill
    # trailers -- the job only checks commits introduced by the current PR
    # (`git rev-list base..head`), so historical un-signed-off commits on
    # `main` are not re-flagged. Every commit from Phase 2 onward must carry
    # a `Signed-off-by:` matching its author (`git commit -s`); a missing one
    # now fails the build. See CONTRIBUTING.md for the flow.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      DCO_ENFORCING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit in the PR
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if ! printf '%s\n' "$trailers" | grep -qiF "$author"; then
              subject="$(git show -s --format='%s' "$sha")"
              echo "::warning::commit $sha \"$subject\" has no Signed-off-by matching its author <$author>"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -eq 0 ]; then
            echo "All PR commits are signed off."
            exit 0
          fi
          echo "$missing commit(s) missing a matching Signed-off-by."
          echo "Fix: git rebase --exec 'git commit --amend --no-edit -s' $base && git push --force-with-lease"
          if [ "$DCO_ENFORCING" = "1" ]; then exit 1; fi
          echo "DCO is advisory (DCO_ENFORCING=0) — not failing the build."
