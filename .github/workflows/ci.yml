name: CI

# Since Phase 2.6 of the desktop->web transition this repository is a Qt-free core
# (`uadas_core/`) plus its tests; the PySide6 desktop shell, its Windows runner and
# its UIA job were deleted in 2.5. Everything here runs on Linux -- the Phase-3 web
# backend target -- so a Windows-only assumption in the core fails CI instead of
# surviving until deployment.
#
# Phase 3.1 adds the Django backend (`apps/api`, package `uadas_api`): its own
# `api-test` job against a Postgres 17 service container, `apps/api` under the lint
# job's ruff/black/isort, and a `django`-not-importable assertion in the core `test`
# job (the core never installs the web framework). See plans/phase-3-readiness.md.
#
# Jobs: `test` (core imports, types, the suite), `api-test` (the Django backend's
# suite, deployment check and bandit), `lint` (ruff/import-linter/bandit/black/isort),
# `dco` (PR sign-off).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    # Promoted from the former `linux_import` job, which already ran exactly the
    # surviving suite. Replaces the Windows `test` job (QtWebEngine, the Py_Finalize
    # access violation, the two-invocation Qt split -- all gone with src/ui) and the
    # Windows-only `uia_integration` job.
    #
    # unixodbc-dev and libmagic1 are the OS packages pyodbc / python-magic need to build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: OS deps for pyodbc / python-magic
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libmagic1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Assert no Qt binding or Django is importable
        # Now the primary runtime proof that the core is Qt-free, alongside the
        # lint job's `lint-imports`: if a dependency ever pulls a Qt binding back
        # in, this fails before the suite can pass by accident. Phase 3.1 extends it
        # to Django: the web backend (apps/api) is installed only by the `api-test`
        # job, so the core's own dependency set must never bring the framework in.
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("PySide6", "PyQt5", "PyQt6", "shiboken6", "django")
                     if importlib.util.find_spec(m) is not None]
          print("importable Qt bindings / Django:", present or "none")
          sys.exit(1 if present else 0)
          PY

      - name: import uadas_core
        run: |
          python -c "import uadas_core; import uadas_core.bootstrap; import uadas_core.services.workspace_service; import uadas_core.ai.assistant_service; import uadas_core.visualization.chart_registry; import uadas_core.database.base_connection; import uadas_core.command_stack; print('uadas_core imports clean')"

      - name: mypy (clean packages)
        # Curated list of packages/modules that are currently clean -- not the whole
        # repo (see docs/MYPY_DEBT.md for what is excluded and why). When a module
        # becomes clean, add it here. --follow-imports=silent keeps mypy using the
        # signatures of modules these call into without holding it responsible for
        # their own pre-existing debt.
        run: >
          python -m mypy
          uadas_core/core uadas_core/services uadas_core/analysis uadas_core/database
          uadas_core/results uadas_core/persistence uadas_core/jobs uadas_core/provenance
          uadas_core/theme uadas_core/a11y uadas_core/help uadas_core/data_table
          uadas_core/actions uadas_core/models uadas_core/bootstrap.py
          uadas_core/command_stack.py
          --ignore-missing-imports --follow-imports=silent

      - name: Collected-test count is not silently shrinking
        # A suite that quietly collects far fewer tests than it should would still go
        # green (observation 0022). 868 at the 2.5 cut-over; the floor leaves room to
        # prune a few tests deliberately but fails on a real collapse. Raise it as the
        # suite grows -- lowering it should be a conscious, reviewed change.
        run: |
          out="$(python -m pytest tests/ --collect-only -q -p no:cacheprovider)"
          echo "$out" | tail -n 3
          count="$(echo "$out" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')"
          test -n "$count" || { echo "::error::could not read a collected-test count"; exit 1; }
          echo "collected: $count"
          test "$count" -ge 860 || { echo "::error::collected $count tests, expected at least 860"; exit 1; }

      - name: pytest
        run: python -m pytest tests/ -q --tb=long -p no:cacheprovider

  api-test:
    # Phase 3.1: the Django 6 + Django Ninja backend (apps/api, package `uadas_api`).
    # A separate job from `test` on purpose -- the core job must keep proving the core
    # runs with no web framework installed. Postgres 17 is the production engine, so
    # the suite runs against it here (`DATABASE_URL`; locally it falls back to in-memory
    # SQLite). The service credentials are throwaway and only reachable on the runner.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uadas
          POSTGRES_PASSWORD: uadas
          POSTGRES_DB: uadas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uadas -d uadas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://uadas:uadas@localhost:5432/uadas
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            apps/api/pyproject.toml

      - name: OS deps for pyodbc / python-magic
        run: sudo apt-get update && sudo apt-get install -y unixodbc-dev libmagic1

      - name: Install dependencies
        # The root distribution (uadas_core) plus the API in editable mode, with its
        # `dev` extra (pytest-django, pytest-cov, django-stubs).
        run: python -m pip install -r requirements.txt -e . -e "apps/api[dev]"

      - name: mypy (apps/api, django-stubs)
        # Its own run, from apps/api, so mypy reads apps/api/pyproject.toml (which loads
        # the django-stubs plugin) instead of the repo-root config (the core's curated,
        # plugin-free run above). Verified clean with the pinned mypy==2.1.0 and
        # django-stubs 6.1.1: the whole package and its tests, no exclusions.
        working-directory: apps/api
        run: python -m mypy uadas_api tests

      - name: Collected-test count is not silently shrinking
        # Same guard as the core job (observation 0022), with its own floor. 731 tests
        # at 3.3 auth (484 at the 3.2 data model, 65 at the 3.1 skeleton; most of the
        # growth is the discovery-based tenant-isolation harness, which multiplies one
        # check across every tenant model, and 3.3's auth/role/last-owner suites) and 744
        # after the core session seam (core_bridge tests). The
        # count includes two Postgres-only race tests that skip on SQLite. The floor is that
        # minus 2, leaving room to prune a couple deliberately while failing on a real
        # collapse (e.g. a conftest import error that silently drops a whole module).
        # Raise it as the suite grows -- lowering it should be a conscious, reviewed
        # change.
        run: |
          out="$(python -m pytest apps/api/tests --collect-only -q -p no:cacheprovider)"
          echo "$out" | tail -n 3
          count="$(echo "$out" | grep -oE '^[0-9]+ tests? collected' | grep -oE '^[0-9]+')"
          test -n "$count" || { echo "::error::could not read a collected-test count"; exit 1; }
          echo "collected: $count"
          test "$count" -ge 742 || { echo "::error::collected $count tests, expected at least 742"; exit 1; }

      - name: pytest (apps/api)
        # DJANGO_SETTINGS_MODULE comes from apps/api/pyproject.toml, not the
        # environment, so the core suite above never initialises Django.
        run: python -m pytest apps/api/tests -q --tb=long -p no:cacheprovider

      - name: manage.py check --deploy (prod settings)
        # The deployment checklist must be clean with a valid production environment;
        # any warning fails the build. The values are throwaway CI-only inputs.
        working-directory: apps/api
        env:
          DJANGO_SETTINGS_MODULE: uadas_api.settings.prod
          DJANGO_SECRET_KEY: ci-throwaway-key-9f3b7c1e4a8d2f6b0c5e7a1d3b9f8e2c4a6d0b1e3c5f7a9b
          DJANGO_ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgres://uadas:uadas@localhost:5432/uadas
          # Required since 3.3 (prod refuses to start without them): the shared cache for
          # allauth's rate limits, the SMTP relay + sender for verification mail, and the
          # SPA's address for the links inside it. Throwaway values; no credentials.
          REDIS_URL: redis://localhost:6379/0
          DEFAULT_FROM_EMAIL: UADAS <no-reply@example.com>
          EMAIL_HOST: smtp.example.com
          FRONTEND_BASE_URL: https://app.example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: bandit (apps/api)
        # Only B101 (assert_used) is skipped -- the API has no accepted findings.
        # Tests are not scanned (they assert freely and spawn subprocesses).
        run: python -m bandit -r apps/api/uadas_api -q --skip B101

  lint:
    # `ruff check` and `bandit` were once enforced only by .claude/hooks/ and
    # .pre-commit-config.yaml -- never in CI itself, so a commit made outside a Claude
    # Code session bypassed both. This job closes that gap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install lint tools
        # Versions kept in sync with requirements.txt (and therefore with
        # .pre-commit-config.yaml and the local hooks). If a pin changes there,
        # change it here too. import-linter provides `lint-imports`; grimp analyses
        # uadas_core statically, so none of its runtime deps need installing here.
        run: python -m pip install ruff==0.16.3 bandit==1.9.4 black==26.5.1 isort==8.0.1 import-linter==2.15

      - name: ruff check
        run: python -m ruff check uadas_core/ tests/ apps/api/

      - name: import-linter (uadas_core stays Qt-free)
        # Five contracts: Qt/Django forbidden in the core, provenance is a leaf, the
        # `layers` stack, the core never imports uadas_api, and uadas_api never
        # imports uadas_core.plugins / .jobs (see .importlinter). uadas_api is a root
        # package there but is not installed in this job, so apps/api goes on
        # PYTHONPATH -- without it lint-imports cannot find the package.
        env:
          PYTHONPATH: apps/api
        run: lint-imports

      - name: bandit
        # `bandit -r uadas_core` has a pre-existing set of accepted findings, skipped
        # by code (cross-platform -- a path-keyed baseline file breaks between
        # Windows and Linux):
        #   B101 assert_used            -- asserts are used deliberately here.
        #   B107 hardcoded_password_default -- fires on `password: str = ""` defaults
        #                                 in ConnectionProfile /
        #                                 DatabaseConnectionService, which
        #                                 deliberately hold NO real password.
        #   B608 hardcoded_sql_expressions  -- 2 intentional query-construction sites
        #                                 (base_connection.py, sqlite_reader.py),
        #                                 confidence Low. execute_query is gated
        #                                 behind an explicit capability but still
        #                                 builds the query from a string, so B608 stays
        #                                 skipped (confirmed by security-reviewer).
        run: python -m bandit -r uadas_core -q --skip B101,B107,B608

      - name: black --check
        run: python -m black --check uadas_core/ tests/ scripts/ apps/api/

      - name: isort --check-only
        run: python -m isort --check-only uadas_core/ tests/ scripts/ apps/api/

  dco:
    # Phase 0.8: Developer Certificate of Origin. Every commit introduced
    # by a pull request must carry a `Signed-off-by:` trailer matching its
    # author -- see CONTRIBUTING.md for the `git commit -s` flow.
    #
    # ENFORCING since the desktop->web transition's Phase 2 (set 2026-09-10,
    # right after Phase 1 merged to main via PR #3). The Phase 0/1 commits
    # that predate this policy were not history-rewritten to backfill
    # trailers -- the job only checks commits introduced by the current PR
    # (`git rev-list base..head`), so historical un-signed-off commits on
    # `main` are not re-flagged. Every commit from Phase 2 onward must carry
    # a `Signed-off-by:` matching its author (`git commit -s`); a missing one
    # now fails the build. See CONTRIBUTING.md for the flow.
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    env:
      DCO_ENFORCING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit in the PR
        shell: bash
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            [ -z "$sha" ] && continue
            author="$(git show -s --format='%an <%ae>' "$sha")"
            trailers="$(git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha")"
            if ! printf '%s\n' "$trailers" | grep -qiF "$author"; then
              subject="$(git show -s --format='%s' "$sha")"
              echo "::warning::commit $sha \"$subject\" has no Signed-off-by matching its author <$author>"
              missing=$((missing + 1))
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -eq 0 ]; then
            echo "All PR commits are signed off."
            exit 0
          fi
          echo "$missing commit(s) missing a matching Signed-off-by."
          echo "Fix: git rebase --exec 'git commit --amend --no-edit -s' $base && git push --force-with-lease"
          if [ "$DCO_ENFORCING" = "1" ]; then exit 1; fi
          echo "DCO is advisory (DCO_ENFORCING=0) — not failing the build."
