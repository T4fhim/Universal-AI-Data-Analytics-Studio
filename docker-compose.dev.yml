# Local-development backing services for the desktop -> web transition
# (plans/web-transition-glass-box-studio.md — Phases 3.1 / 3.4 / 3.5 / 6).
#
# NOT for production. Every credential here is a throwaway localhost default;
# real deployments inject secrets via env / a secret manager (plan Phase 3.8).
#
#   Bring up:   docker compose -f docker-compose.dev.yml up -d
#   Status:     docker compose -f docker-compose.dev.yml ps
#   Logs:       docker compose -f docker-compose.dev.yml logs -f
#   Tear down:  docker compose -f docker-compose.dev.yml down        (-v also wipes data)
#
# Requires Docker Desktop running (either the WSL2 or the Hyper-V backend works —
# these are plain Linux service images, nothing here depends on WSL specifically).
# If `docker` is not yet on PATH, see the setup notes handed over with this file.

name: uadas-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: uadas
      POSTGRES_PASSWORD: uadas
      POSTGRES_DB: uadas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uadas -d uadas"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console -> http://localhost:9001
    volumes:
      - miniodata:/data

  # One-shot: wait for MinIO, create the buckets the app expects, then exit 0.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - >
        until mc alias set local http://minio:9000 minioadmin minioadmin; do
          echo 'waiting for minio...'; sleep 2;
        done &&
        mc mb --ignore-existing local/uadas-uploads &&
        mc mb --ignore-existing local/uadas-materializations &&
        mc mb --ignore-existing local/uadas-exports &&
        echo 'minio buckets ready'

volumes:
  pgdata:
  redisdata:
  miniodata:
